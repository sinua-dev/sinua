[package]
name = "uniffi-bindgen"
description = "CLI that generates Swift/Kotlin bindings from core_engine's UniFFI scaffolding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"
