[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["The Sinua Authors"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
# panic = "unwind" (the default) is required, not "abort": UniFFI wraps every
# exported call in catch_unwind to turn a Rust panic into a safe error at the
# FFI boundary instead of aborting the host process.
