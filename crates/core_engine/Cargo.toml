[package]
name = "core_engine"
description = "Shared geometry engine for Sinua visual effects (ported from thinking-orbs, MIT, Jakub Antalik)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# The engine reaches users as @sinua/core (wasm), a SwiftPM package and a Maven
# artifact -- never as a crates.io crate. Without this, `cargo publish` from the
# workspace root would release it. Publishing it later is a deliberate change
# here and in tests/manifests.rs, not an accident.
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

# uniffi (iOS/Android/RN bindings) and wasm-bindgen (Web) are mutually
# exclusive per target: uniffi's scaffolding does not build for
# wasm32-unknown-unknown, and wasm-bindgen has no reason to exist anywhere
# else. Each is a dependency only for the target that uses it.
# FX Spec parsing (crates/core_engine/src/fx_spec.rs) runs on every target.
[dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = "0.32"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
